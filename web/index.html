  <script>
    (function () {
      function ready() {
        return !!(window.google && google.maps && google.maps.importLibrary);
      }

      function minutes(ms) {
        var total = Math.max(1, Math.round(ms / 60000));
        var hours = Math.floor(total / 60);
        var mins = total % 60;
        if (!hours) return total + ' min';
        return mins ? hours + ' hr ' + mins + ' min' : hours + ' hr';
      }

      function kilometers(meters) {
        if (meters < 1000) return Math.round(meters) + ' m';
        return (meters / 1000).toFixed(meters < 10000 ? 1 : 0) + ' km';
      }

      function haversineKm(a, b) {
        var r = 6371;
        var dLat = (b.lat - a.lat) * Math.PI / 180;
        var dLng = (b.lng - a.lng) * Math.PI / 180;
        var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) *
          Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return 2 * r * Math.asin(Math.min(1, Math.sqrt(h)));
      }

      function sampleByDistance(points, count) {
        if (points.length <= count) return points.slice();
        var total = 0;
        var steps = [];
        for (var i = 1; i < points.length; i++) {
          total += haversineKm(points[i - 1], points[i]);
          steps.push(total);
        }
        var samples = [points[0]];
        var target = 1;
        for (var n = 1; n < points.length && samples.length < count - 1; n++) {
          if (steps[n - 1] >= total * target / (count - 1)) {
            samples.push(points[n]);
            target += 1;
          }
        }
        samples.push(points[points.length - 1]);
        return samples;
      }

      function decodePolyline(str, precision) {
        var index = 0, lat = 0, lng = 0, coordinates = [], factor = Math.pow(10, precision || 6);
        while (index < str.length) {
          var shift = 0, result = 0, byte = 0;
          do {
            byte = str.charCodeAt(index++) - 63;
            result |= (byte & 0x1f) << shift;
            shift += 5;
          } while (byte >= 0x20);
          lat += (result & 1) ? ~(result >> 1) : (result >> 1);
          shift = 0;
          result = 0;
          do {
            byte = str.charCodeAt(index++) - 63;
            result |= (byte & 0x1f) << shift;
            shift += 5;
          } while (byte >= 0x20);
          lng += (result & 1) ? ~(result >> 1) : (result >> 1);
          coordinates.push({ lat: lat / factor, lng: lng / factor });
        }
        return coordinates;
      }

      function pointOf(location) {
        if (!location) return null;
        var lat = typeof location.lat === 'function' ? location.lat() : location.lat;
        var lng = typeof location.lng === 'function' ? location.lng() : location.lng;
        if (typeof lat !== 'number' || typeof lng !== 'number') return null;
        return { lat: lat, lng: lng };
      }

      async function overpassFuel(lat, lng) {
        var query = '[out:json][timeout:12];(node["amenity"="fuel"](around:15000,' + lat + ',' + lng + ');way["amenity"="fuel"](around:15000,' + lat + ',' + lng + '););out center 80;';
        var servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
        var last = 'Fuel lookup failed';
        for (var i = 0; i < servers.length; i++) {
          try {
            var response = await fetch(servers[i], { method: 'POST', body: new URLSearchParams({ data: query }) });
            if (!response.ok) continue;
            var body = await response.json();
            return (body.elements || []).map(function (el) {
              var spotLat = el.lat, spotLng = el.lon;
              if ((spotLat == null || spotLng == null) && el.center) {
                spotLat = el.center.lat;
                spotLng = el.center.lon;
              }
              if (spotLat == null || spotLng == null) return null;
              var tags = el.tags || {};
              return {
                id: el.type + '-' + el.id,
                name: tags.brand || tags.name || tags.operator || 'Petrol pump',
                lat: spotLat,
                lng: spotLng
              };
            }).filter(Boolean);
          } catch (error) {
            last = error.message || String(error);
          }
        }
        throw new Error(last);
      }

      async function photonSearch(query, lat, lng) {
        var response = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&lat=' + lat + '&lon=' + lng + '&limit=6');
        if (!response.ok) throw new Error('Search failed');
        var body = await response.json();
        var seen = {};
        return (body.features || []).map(function (feature) {
          var props = feature.properties || {};
          var coords = feature.geometry && feature.geometry.coordinates;
          if (!coords) return null;
          var id = coords[1] + ',' + coords[0];
          if (seen[id]) return null;
          seen[id] = true;
          return {
            placeId: id,
            name: props.name || query,
            detail: [props.street, props.city, props.state, props.country].filter(Boolean).join(', ')
          };
        }).filter(Boolean);
      }

      async function osrmRoutes(oLat, oLng, dLat, dLng, via) {
        var coords = [oLng + ',' + oLat];
        (via || []).forEach(function (spot) { coords.push(spot.lng + ',' + spot.lat); });
        coords.push(dLng + ',' + dLat);
        var url = 'https://router.project-osrm.org/route/v1/driving/' +
          coords.join(';') +
          '?alternatives=true&overview=full&geometries=geojson&steps=true';
        var response = await fetch(url);
        if (!response.ok) throw new Error('Directions failed');
        var data = await response.json();
        var routes = (data.routes || []).map(function (route) {
          var coords = (route.geometry && route.geometry.coordinates) || [];
          var points = coords.map(function (pair) { return { lat: pair[1], lng: pair[0] }; });
          var names = [];
          var steps = [];
          ((route.legs || [])[0] || {}).steps && ((route.legs || [])[0].steps || []).forEach(function (step) {
            var road = step.name;
            if (road && names.indexOf(road) < 0) names.push(road);
            var at = (step.maneuver && step.maneuver.location) || [oLng, oLat];
            steps.push({
              instruction: (step.maneuver && step.maneuver.type) ? ((road ? road + ' · ' : '') + step.maneuver.type) : (road || 'Continue'),
              lat: at[1],
              lng: at[0]
            });
          });
          return {
            summary: names.slice(0, 2).join(' · ') || 'Driving route',
            duration: minutes((route.duration || 0) * 1000),
            distance: kilometers(route.distance || 0),
            durationSeconds: Math.round(route.duration || 0),
            distanceMeters: Math.round(route.distance || 0),
            points: points,
            steps: steps
          };
        }).filter(function (route) { return route.points.length >= 2; });
        if (!routes.length) throw new Error('No driving route from here.');
        return routes;
      }

      async function valhallaRoutes(oLat, oLng, dLat, dLng, via) {
        var locations = [{ lon: oLng, lat: oLat }];
        (via || []).forEach(function (spot) { locations.push({ lon: spot.lng, lat: spot.lat }); });
        locations.push({ lon: dLng, lat: dLat });
        var body = {
          locations: locations,
          costing: 'auto',
          alternates: 2,
          directions_options: { units: 'kilometers' }
        };
        var response = await fetch('https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify(body)));
        if (!response.ok) throw new Error('Directions failed');
        var data = await response.json();
        var trips = [];
        if (data.trip) trips.push(data.trip);
        (data.alternates || []).forEach(function (alt) { if (alt.trip) trips.push(alt.trip); });
        var routes = trips.map(function (trip) {
          var leg = (trip.legs || [])[0] || {};
          var names = [];
          (leg.maneuvers || []).forEach(function (step) {
            (step.street_names || []).forEach(function (name) {
              if (name && names.indexOf(name) < 0) names.push(name);
            });
          });
          var points = decodePolyline(leg.shape || '', 6);
          var steps = (leg.maneuvers || []).map(function (step) {
            var at = points[Math.min(step.begin_shape_index || 0, Math.max(points.length - 1, 0))] || { lat: oLat, lng: oLng };
            var road = (step.street_names || [])[0];
            return {
              instruction: step.instruction || (road ? 'Continue on ' + road : 'Continue'),
              lat: at.lat,
              lng: at.lng
            };
          });
          return {
            summary: names.slice(0, 2).join(' · ') || 'Driving route',
            duration: minutes((trip.summary.time || 0) * 1000),
            distance: kilometers((trip.summary.length || 0) * 1000),
            durationSeconds: Math.round(trip.summary.time || 0),
            distanceMeters: Math.round((trip.summary.length || 0) * 1000),
            points: points,
            steps: steps
          };
        }).filter(function (route) { return route.points.length >= 2; });
        if (!routes.length) throw new Error('No driving route from here.');
        return routes;
      }

      window.zenRidesMaps = {
        fuelAlong: async function (pointsJson) {
          var points = [];
          try { points = pointsJson ? JSON.parse(pointsJson) : []; } catch (error) { points = []; }
          if (!Array.isArray(points) || points.length < 2) return JSON.stringify([]);
          var length = 0;
          for (var i = 1; i < points.length; i++) length += haversineKm(points[i - 1], points[i]);
          var count = Math.min(40, Math.max(2, Math.ceil(length / 4) || 2));
          var samples = sampleByDistance(points, count);
          if (ready()) {
            try {
              var places = await google.maps.importLibrary('places');

              var collected = [];

              for (var s = 0; s < samples.length; s++) {
                var request = {
                  fields: ['displayName', 'location', 'id'],

                  var result = await places.Place.searchNearby(request);
                  (result.places || []).forEach(function (place) {
                    var spot = pointOf(place.location);
                    if (!place.id || seen[place.id] || !spot) return;
                    seen[place.id] = true;
                    collected.push({ id: place.id, name: place.displayName || 'Petrol pump', lat: spot.lat, lng: spot.lng });
                  });
                } catch (error) {
                  continue;
                }
              }
              if (collected.length) return JSON.stringify(collected);
            } catch (error) {}
          }
          var south = points[0].lat, north = south, west = points[0].lng, east = west;
          points.forEach(function (spot) {
            south = Math.min(south, spot.lat);
            north = Math.max(north, spot.lat);
            west = Math.min(west, spot.lng);
            east = Math.max(east, spot.lng);
          });
          var pad = 0.01;
          var query = '[out:json][timeout:15];(node["amenity"="fuel"](' + (south - pad) + ',' + (west - pad) + ',' + (north + pad) + ',' + (east + pad) + ');way["amenity"="fuel"](' + (south - pad) + ',' + (west - pad) + ',' + (north + pad) + ',' + (east + pad) + '););out center 160;';
          var servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
          for (var n = 0; n < servers.length; n++) {
            try {
              var response = await fetch(servers[n], { method: 'POST', body: new URLSearchParams({ data: query }) });
              if (!response.ok) continue;
              var body = await response.json();
              return JSON.stringify((body.elements || []).map(function (el) {
                var spotLat = el.lat, spotLng = el.lon;
                if ((spotLat == null || spotLng == null) && el.center) {
                  spotLat = el.center.lat;
                  spotLng = el.center.lon;
                }
                if (spotLat == null || spotLng == null) return null;
                var tags = el.tags || {};
                return { id: el.type + '-' + el.id, name: tags.brand || tags.name || tags.operator || 'Petrol pump', lat: spotLat, lng: spotLng };
              }).filter(Boolean));
            } catch (error) {}
          }
          return JSON.stringify([]);
        },
        nearbyFuel: async function (lat, lng) {
          if (ready()) {
            try {
              var places = await google.maps.importLibrary('places');
              var rank = places.SearchNearbyRankPreference && places.SearchNearbyRankPreference.DISTANCE;
              var centers = [
                { lat: lat, lng: lng },
                { lat: lat + 0.06, lng: lng },
                { lat: lat - 0.06, lng: lng },
                { lat: lat, lng: lng + 0.06 },
                { lat: lat, lng: lng - 0.06 }
              ];
              var seen = {};
              var collected = [];
              for (var i = 0; i < centers.length; i++) {
                var request = {
                  fields: ['displayName', 'location', 'id'],
                  locationRestriction: { center: centers[i], radius: 8000 },
                  includedPrimaryTypes: ['gas_station'],
                  maxResultCount: 20
                };
                if (rank) request.rankPreference = rank;
                try {
                  var result = await places.Place.searchNearby(request);
                  (result.places || []).forEach(function (place) {
                    var spot = pointOf(place.location);
                    if (!place.id || seen[place.id] || !spot) return;
                    seen[place.id] = true;
                    collected.push({ id: place.id, name: place.displayName || 'Petrol pump', lat: spot.lat, lng: spot.lng });
                  });
                } catch (error) {
                  break;
                }
              }
              if (collected.length) return JSON.stringify(collected);
            } catch (error) {}
          }
          return JSON.stringify(await overpassFuel(lat, lng));
        },
        tollsAlong: async function (pointsJson) {
          var points = [];
          try { points = pointsJson ? JSON.parse(pointsJson) : []; } catch (error) { points = []; }
          if (!Array.isArray(points) || points.length < 2) return JSON.stringify([]);
          var length = 0;
          for (var i = 1; i < points.length; i++) length += haversineKm(points[i - 1], points[i]);
          var count = Math.min(16, Math.max(2, Math.ceil(length / 20) || 2));
          var samples = sampleByDistance(points, count);
          var seen = {};
          var collected = [];
          function keepToll(id, name, lat, lng) {
            if (!id || seen[id] || lat == null || lng == null) return;
            if (!/toll|naka|plaza|gantry/i.test(name || '')) return;
            seen[id] = true;
            collected.push({ id: id, name: name || 'Toll naka', lat: lat, lng: lng });
          }
          if (ready()) {
            try {
              var places = await google.maps.importLibrary('places');
              var spacing = count > 1 ? length / (count - 1) : 20;
              var radius = Math.min(8000, Math.max(2500, spacing * 400));
              for (var s = 0; s < samples.length; s++) {
                try {
                  var result = await places.Place.searchByText({
                    textQuery: 'toll plaza',
                    fields: ['displayName', 'location', 'id'],
                    locationBias: { center: { lat: samples[s].lat, lng: samples[s].lng }, radius: radius },
                    maxResultCount: 8
                  });
                  (result.places || []).forEach(function (place) {
                    var spot = pointOf(place.location);
                    if (!spot) return;
                    keepToll(place.id, place.displayName || '', spot.lat, spot.lng);
                  });
                } catch (error) {}
              }
            } catch (error) {}
          }
          var south = points[0].lat, north = south, west = points[0].lng, east = west;
          points.forEach(function (spot) {
            south = Math.min(south, spot.lat);
            north = Math.max(north, spot.lat);
            west = Math.min(west, spot.lng);
            east = Math.max(east, spot.lng);
          });
          var pad = 0.02;
          var query = '[out:json][timeout:15];(node["barrier"="toll_booth"](' + (south - pad) + ',' + (west - pad) + ',' + (north + pad) + ',' + (east + pad) + ');way["barrier"="toll_booth"](' + (south - pad) + ',' + (west - pad) + ',' + (north + pad) + ',' + (east + pad) + ');node["highway"="toll_gantry"](' + (south - pad) + ',' + (west - pad) + ',' + (north + pad) + ',' + (east + pad) + '););out center 80;';
          var servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
          for (var n = 0; n < servers.length; n++) {
            try {
              var response = await fetch(servers[n], { method: 'POST', body: new URLSearchParams({ data: query }) });
              if (!response.ok) continue;
              var body = await response.json();
              (body.elements || []).forEach(function (el) {
                var spotLat = el.lat, spotLng = el.lon;
                if ((spotLat == null || spotLng == null) && el.center) {
                  spotLat = el.center.lat;
                  spotLng = el.center.lon;
                }
                var tags = el.tags || {};
                var name = tags.name || tags.ref || tags.operator || 'Toll naka';
                if (!el.type || el.id == null || spotLat == null || spotLng == null) return;
                var id = el.type + '-' + el.id;
                if (seen[id]) return;
                seen[id] = true;
                collected.push({ id: id, name: name, lat: spotLat, lng: spotLng });
              });
              break;
            } catch (error) {}
          }
          return JSON.stringify(collected);
        },
        search: async function (query, lat, lng) {
          if (ready()) {
            try {
              var places = await google.maps.importLibrary('places');
              var result = await places.AutocompleteSuggestion.fetchAutocompleteSuggestions({
                input: query,
                origin: { lat: lat, lng: lng }
              });
              var hits = (result.suggestions || []).slice(0, 6).map(function (item) {
                var prediction = item.placePrediction || {};
                var main = prediction.mainText;
                var secondary = prediction.secondaryText;
                var full = prediction.text;
                return {
                  placeId: prediction.placeId,
                  name: (main && (main.text || main)) || (full && (full.text || full)) || 'Place',
                  detail: (secondary && (secondary.text || secondary)) || ''
                };
              }).filter(function (item) { return item.placeId; });
              if (hits.length) return JSON.stringify(hits);
            } catch (error) {}
          }
          return JSON.stringify(await photonSearch(query, lat, lng));
        },
        directions: async function (oLat, oLng, placeId, viaJson) {
          var via = [];
          try { via = viaJson ? JSON.parse(viaJson) : []; } catch (error) { via = []; }
          if (!Array.isArray(via)) via = [];
          var origin = { lat: oLat, lng: oLng };
          var coordinate = /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(String(placeId));
          var destination = origin;
          var dLat = oLat;
          var dLng = oLng;
          if (coordinate) {
            var parts = String(placeId).split(',');
            dLat = parseFloat(parts[0]);
            dLng = parseFloat(parts[1]);
            destination = { lat: dLat, lng: dLng };
          } else {
            destination = 'places/' + placeId;
          }
          if (ready()) {
            try {
              var routesLib = await google.maps.importLibrary('routes');
              var request = {
                origin: origin,
                destination: destination,
                travelMode: 'DRIVING',
                routingPreference: 'TRAFFIC_AWARE',
                departureTime: new Date(),
                computeAlternativeRoutes: true,
                fields: ['path', 'durationMillis', 'distanceMeters', 'description']
              };
              if (via.length) {
                request.intermediates = via.map(function (spot) {
                  return { lat: spot.lat, lng: spot.lng };
                });
              }
              var result = await routesLib.Route.computeRoutes(request);
              var routes = (result.routes || []).map(function (route) {
                var points = [];
                (route.path || []).forEach(function (point) {
                  var spot = pointOf(point);
                  if (spot) points.push(spot);
                });
                return {
                  summary: route.description || 'Driving route',
                  duration: minutes(route.durationMillis || 0),
                  distance: kilometers(route.distanceMeters || 0),
                  durationSeconds: Math.round((route.durationMillis || 0) / 1000),
                  distanceMeters: Math.round(route.distanceMeters || 0),
                  traffic: true,
                  points: points,
                  steps: points.length ? [{ instruction: route.description || 'Head to the destination', lat: points[0].lat, lng: points[0].lng }] : []
                };
              }).filter(function (route) { return route.points.length >= 2; });
              if (routes.length) return JSON.stringify(routes);
            } catch (error) {}
          }
          if (!coordinate) throw new Error('No driving route from here.');
          try {
            return JSON.stringify(await valhallaRoutes(oLat, oLng, dLat, dLng, via));
          } catch (error) {
            return JSON.stringify(await osrmRoutes(oLat, oLng, dLat, dLng, via));
          }
        },
        hazards: async function (lat, lng, heading) {
          function scrub(error) {
            var text = error && (error.message || error.status) ? (error.message || error.status) : String(error);
            return String(text).replace(/AIza[0-9A-Za-z_\-]+/g, '[key]');
          }
          function mapsKey() {
            var scripts = document.getElementsByTagName('script');
            for (var i = 0; i < scripts.length; i++) {
              var src = scripts[i].src || '';
              if (src.indexOf('maps.googleapis.com/maps/api/js') < 0) continue;
              var match = src.match(/[?&]key=([^&]+)/);
              if (match) return decodeURIComponent(match[1]);
            }
            return '';
          }
          var failures = [];
          var hazards = [];
          var rad = (heading || 0) * Math.PI / 180;
          var km = 8;
          var dest = {
            lat: lat + (km / 110.574) * Math.cos(rad),
            lng: lng + (km / (111.32 * Math.max(0.2, Math.cos(lat * Math.PI / 180)))) * Math.sin(rad)
          };
          if (!ready()) {
            failures.push('Routes API Route.computeRoutes: Google Maps JavaScript library is not loaded');
          } else {
            try {
              var routesLib = await google.maps.importLibrary('routes');
              var result = await routesLib.Route.computeRoutes({
                origin: { lat: lat, lng: lng },
                destination: dest,
                travelMode: 'DRIVING',

              (result.routes || []).forEach(function (route, ri) {

                  if (!warning) return;

                    lng: null

                    id: 'routes-jam-' + ri + '-' + si,

            } else {
              (body.routes || []).forEach(function (route, ri) {
                (route.warnings || []).forEach(function (warning, wi) {
                  if (!warning) return;
                  hazards.push({
                    id: 'directions-warning-' + ri + '-' + wi,
                    title: String(warning),
                    detail: 'Directions API warnings',
                    lat: null,
                    lng: null
                  });
                });
              });
            }
          } catch (error) {
            failures.push('Directions API directions/json: ' + scrub(error));
          }
          return JSON.stringify({ hazards: hazards, failures: failures });
        },
        placePoint: async function (placeId) {
          if (/^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$/.test(placeId)) {
            var parts = placeId.split(',');
            return JSON.stringify({ lat: parseFloat(parts[0]), lng: parseFloat(parts[1]) });

          await place.fetchFields({ fields: ['location'] });
          var spot = pointOf(place.location);
          if (!spot) throw new Error('That place has no map point.');
          return JSON.stringify(spot);
        }
      };
