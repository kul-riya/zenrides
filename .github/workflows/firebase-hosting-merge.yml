# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - dev_riya
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone https://github.com/flutter/flutter.git --depth 1 -b stable
          "$RUNNER_TEMP/flutter" && "$RUNNER_TEMP/flutter/bin/flutter" build web
          --release --no-web-resources-cdn --pwa-strategy=none
          --output "$GITHUB_WORKSPACE/public"
          --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          && cp "$GITHUB_WORKSPACE/web/flutter_service_worker.js" "$GITHUB_WORKSPACE/public/flutter_service_worker.js"
          && cp "$GITHUB_WORKSPACE/web/sw.js" "$GITHUB_WORKSPACE/public/sw.js"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYZENRIDES }}
          channelId: live
          projectId: myzenrides
